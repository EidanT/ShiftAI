[project]
name = "shiftai-services"
version = "0.1.0"
description = "IA shift
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.20",
  "httpx>=0.27",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "Pillow>=10.4",
  "pytesseract>=0.3.13",
  "slowapi>=0.1.9",
  "reportlab>=4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "document_processing*", "llm*", "router*", "providers*", "logger*", "lib*"]
