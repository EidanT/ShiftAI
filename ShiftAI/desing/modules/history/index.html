<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historiales y Consultas — ShiftAI Design</title>
  <!-- Tailwind v4 (runtime browser) + iconos lucide -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../../shared/shell.css">
  <link rel="stylesheet" href="style.css">
  <style type="text/tailwindcss">
    @import "tailwindcss";
    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Space Grotesk", sans-serif;
    }
  </style>
</head>
<body data-module="history" class="bg-[#F8FAFC]">
  <div id="app-layout">
    <div id="sidebar-mount"></div>
    <div id="header-mount"></div>
    <main id="main" class="flex-1 p-6 relative">
      <!-- HistoryQueriesView -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-fade-in text-left">

        <!-- Columna izquierda -->
        <div class="lg:col-span-8 xl:col-span-9 flex flex-col gap-6">

          <!-- Tarjeta resumen de empleado -->
          <div class="bg-white rounded-xl border border-[#E2E8F0] shadow-sm p-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-indigo-50/40 to-transparent rounded-bl-full pointer-events-none"></div>
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-6 relative z-10">
              <!-- Avatar -->
              <div class="relative shrink-0 select-none">
                <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-slate-100 shadow-md">
                  <img id="emp-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="" class="w-full h-full object-cover" referrerpolicy="no-referrer">
                </div>
                <span class="absolute bottom-1 right-1 w-4.5 h-4.5 bg-[#10B981] border-2 border-white rounded-full" title="Activo Online"></span>
              </div>
              <!-- Info -->
              <div class="flex-1 text-left min-w-0">
                <div class="flex flex-wrap items-center gap-2 mb-1">
                  <h3 id="emp-nombre" class="text-xl font-extrabold text-[#0F172A] tracking-tight truncate max-w-[200px]"></h3>
                  <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-[#10B981] border border-emerald-100">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#10B981]"></span>
                    Activo
                  </span>
                </div>
                <p id="emp-cargo-depto" class="text-xs font-semibold text-slate-700 font-sans tracking-wide"></p>
                <div class="flex flex-wrap gap-4 mt-3">
                  <div class="flex items-center gap-1.5 text-xs text-slate-500 bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-150">
                    <i data-lucide="briefcase" class="w-4 h-4 text-slate-400"></i>
                    <span id="emp-id" class="font-mono font-bold"></span>
                  </div>
                  <div class="flex items-center gap-1.5 text-xs text-slate-500 bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-150">
                    <i data-lucide="mail" class="w-4 h-4 text-slate-400 animate-pulse"></i>
                    <span id="emp-correo"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Controles / Selector de empleado -->
          <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-xl border border-[#E2E8F0] shadow-sm">
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
              <div class="relative w-full sm:w-60">
                <select id="emp-selector" class="w-full appearance-none pl-3.5 pr-10 py-2 border border-slate-200 bg-slate-50 text-slate-800 font-semibold rounded-lg text-xs focus:ring-[#6366F1] focus:border-[#6366F1] outline-none cursor-pointer">
                  <!-- options inyectadas por script.js -->
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              </div>
              <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 py-2 px-3 rounded-lg text-xs font-semibold text-slate-600 cursor-pointer">
                <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
                <span>Oct 01, 2023 - Oct 31, 2023</span>
              </div>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto font-bold text-xs select-none">
              <button class="flex-1 sm:flex-none py-2 px-3.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 hover:bg-slate-100 flex items-center justify-center gap-1">
                <i data-lucide="file-text" class="w-4 h-4 text-slate-400"></i>
                <span>PDF</span>
              </button>
              <button class="flex-1 sm:flex-none py-2 px-3.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 hover:bg-slate-100 flex items-center justify-center gap-1">
                <i data-lucide="file-spreadsheet" class="w-4 h-4 text-slate-400"></i>
                <span>Excel</span>
              </button>
            </div>
          </div>

          <!-- Tarjeta de pestañas -->
          <div class="bg-white rounded-xl border border-[#E2E8F0] shadow-sm overflow-hidden flex flex-col h-full min-h-[460px]">
            <!-- Barra de pestañas -->
            <div id="subtabs-bar" class="border-b border-slate-100 bg-slate-50/50 pt-2 px-2 flex overflow-x-auto select-none scrollbar-none">
              <!-- botones inyectados por script.js -->
            </div>

            <!-- Contenido de la pestaña activa -->
            <div id="tab-content" class="flex-1 p-6">
              <!-- render dinámico por script.js -->
            </div>

            <!-- Pie de paginación -->
            <div class="px-6 py-3 border-t border-slate-100 flex items-center justify-between bg-slate-50 text-xs text-[#8590a6] select-none font-semibold">
              <span id="resultados-auditados">Resultados auditados</span>
              <div class="flex gap-2">
                <button class="px-2.5 py-0.5 border border-slate-200 bg-white rounded-md text-[11px] font-bold text-slate-500 disabled:opacity-40">Anterior</button>
                <button class="px-2.5 py-0.5 border border-slate-200 bg-white rounded-md text-[11px] font-bold text-slate-500 disabled:opacity-40">Siguiente</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Columna derecha — Actividad reciente -->
        <div class="lg:col-span-4 xl:col-span-3">
          <div class="bg-white rounded-xl border border-[#E2E8F0] shadow-sm p-5 h-full min-h-[500px] flex flex-col select-none">
            <div class="flex items-center justify-between mb-6">
              <h3 class="text-sm font-semibold tracking-tight text-[#0F172A] uppercase">Actividad Reciente</h3>
              <span class="text-[10px] bg-slate-100 text-slate-500 font-bold px-2 py-0.5 rounded">Log</span>
            </div>
            <div id="activity-timeline" class="flex-1 overflow-y-auto pr-2 relative activity-line">
              <!-- items inyectados por script.js -->
            </div>
            <button class="mt-4 w-full py-2 text-center text-xs font-semibold text-[#6366F1] bg-slate-50 border border-slate-150 rounded-lg hover:bg-slate-100 transition-colors">
              Ver registro completo de auditoría
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../../shared/data.js"></script>
  <script src="../../shared/shell.js"></script>
  <script src="script.js"></script>
</body>
</html>
